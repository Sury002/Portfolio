<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTactix | Surya K - 3D Portfolio</title>
  <link rel="icon" href="./Assets/Logo.jpeg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Libraries -->
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  
  <!-- 3D & Animation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  
  <!-- React Setup -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#c2a05d', // Champagne Gold
            secondary: '#1c1917', // Dark Stone (Text)
            accent: '#78716c', // Muted Stone
            dark: '#a8a29e', // Light-Dark
            light: '#f5f5f4', // Off-White
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-[#faf8f5] via-[#ece8e1] to-[#d6cfc5] text-secondary min-h-screen overflow-x-hidden selection:bg-primary selection:text-white">
  <!-- Loading Screen -->
  <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-br from-[#faf8f5] via-[#ece8e1] to-[#d6cfc5] transition-opacity duration-1000">
    <div class="relative w-32 h-32 mb-8">
      <div class="absolute inset-0 border-4 border-primary/20 rounded-full"></div>
      <div class="absolute inset-0 border-4 border-t-primary rounded-full animate-spin"></div>
      <img src="./Assets/Logo.jpeg" alt="Logo" class="absolute inset-4 w-24 h-24 object-contain rounded-full">
    </div>
    <h2 class="text-2xl font-bold font-outfit tracking-widest uppercase text-stone-700">Loading Portfolio</h2>
    <div class="mt-4 w-48 h-1 bg-stone-200 rounded-full overflow-hidden">
      <div id="loader-bar" class="w-0 h-full bg-gradient-to-r from-primary to-[#a18349] transition-all duration-300"></div>
    </div>
  </div>

  <!-- 3D Canvas -->
  <canvas id="canvas3d" class="fixed top-0 left-0 w-full h-full -z-10 outline-none"></canvas>

  <div id="root"></div>

  <script type="text/babel" src="app.js"></script>
</body>
</html>
